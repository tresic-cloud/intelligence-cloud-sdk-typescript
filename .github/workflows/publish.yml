name: Publish to npm

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Staged publishing (npm stage publish) needs npm 12; Node 22 ships npm 10.
      - run: npm install -g npm@12
      - name: Check the tag matches the package version
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME does not match version $v"; exit 1; }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The release is STAGED, not published: a maintainer approves it on npmjs.com (or with
      # `npm stage approve <stage-id>`) with 2FA, and only then does it go public.
      # Auth: trusted publishing (OIDC) once the package has a trusted publisher allowed to stage;
      # for the very first version only, the short-lived NPM_TOKEN environment secret. Delete
      # the secret right after 0.1.0 is approved.
      - run: npm stage publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
